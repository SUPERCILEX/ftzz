[package]
name = "ftzz"
version = "4.0.0"
authors = ["Alex Saveau <saveau.alexandre@gmail.com>"]
edition = "2024"
description = "File Tree Fuzzer creates a pseudo-random directory hierarchy filled with some number of files."
repository = "https://github.com/SUPERCILEX/ftzz"
keywords = ["tools", "files", "fuzz"]
categories = ["command-line-utilities", "development-tools", "development-tools::testing", "filesystem"]
license = "Apache-2.0"
rust-version = "1.88"

[dependencies]
bon = "3.10.2"
bytesize = "2.7.0"
clap = { version = "4.6.7", features = ["derive", "wrap_help"] }
clap-num = "1.2.0"
clap-verbosity-flag = { package = "clap-verbosity-flag2", version = "2.1.1" }
env_logger = { version = "0.11.11", default-features = false, features = ["auto-color"] }
error-stack = { version = "0.8.0", default-features = false, features = ["std"] }
io-adapters = "0.4.0"
itoa = "1.0.18"
log = { version = "0.4.34", features = ["release_max_level_info"] }
rand = { version = "0.10.3", default-features = false, features = ["std"] }
rand_distr = "0.6.0"
rand_xoshiro = "0.8.1"
sysexits = "0.13.0"
thiserror = "2.0.21"
thousands = "0.2.0"
tokio = { version = "1.53.2", features = ["rt"] }
tracing = { version = "0.1.44", features = ["log"], optional = true }
tracing-log = { version = "0.2.0", optional = true }
tracing-subscriber = { version = "0.3.23", optional = true }
tracing-tracy = { version = "0.12.0", features = ["flush-on-exit"], optional = true }
tracy-client = { version = "0.19.0", optional = true }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.5", features = ["fs", "thread"] }

[dev-dependencies]
criterion = "0.8.2"
expect-test = "1.5.1"
more-asserts = "0.3.1"
rand = "0.10.3"
rstest = { version = "0.27.0", default-features = false }
supercilex-tests = "0.4.23"
tempfile = "3.27.0"
trycmd = "1.2.1"

[build-dependencies]
itoa = "1.0.18"

[features]
trace = ["tracing", "dep:tracing-log", "dep:tracing-subscriber", "dep:tracing-tracy", "dep:tracy-client"]
dry_run = []

[[bench]]
name = "generator"
harness = false

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dr]
inherits = "release"
debug = true
debug-assertions = true
strip = false
